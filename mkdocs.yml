site_name: Detection Engineering Framework
site_description: A lifecycle standard for building, governing and retiring security detections.
site_author: Kunal Hatode
site_url: https://ke0xes.github.io/Detection-Engineering-Framework/

repo_url: https://github.com/Ke0xes/Detection-Engineering-Framework
repo_name: Ke0xes/Detection-Engineering-Framework
edit_uri: edit/main/docs/

copyright: >
  Prose CC BY 4.0 &middot; Schemas and code Apache-2.0 &middot;
  Detection Engineering Framework v3.0.0

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Normative core:
      - Specification: 00-specification.md
      - Conformance Model: 10-conformance.md
  - Lifecycle:
      - Background and Introduction: 01-introduction.md
      - Detection Engineering Lifecycle: 02-lifecycle.md
      - Planning Phase: 03-planning-phase.md
      - Development A - Technical Feasibility: 04-development-feasibility.md
      - Development B - Detection Engineering: 05-development-detection-engineering.md
      - Development C - Response Engineering: 06-development-response-engineering.md
      - Delivery Phase: 07-delivery-phase.md
      - Improvement Phase: 08-improvement-phase.md
  - Engineering practice:
      - Detection Metrics: 09-metrics.md
      - Detection as Code: 11-detection-as-code.md
      - Telemetry and Data: 12-telemetry-and-data.md
      - Detection Robustness: 13-detection-robustness.md
      - Modern Attack Surfaces: 14-modern-attack-surfaces.md
      - Governance and Roles: 15-governance-and-roles.md
  - Applying it:
      - Adoption Guide: 16-adoption-guide.md
      - Advanced Best Practices: 17-best-practices.md
      - Related Work: 18-related-work.md
      - Worked Example: 19-worked-example.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
