schema_version: "3.0"
id: DET-2026-0001
version: 1.2.0
title: OAuth application consent granted to unverified publisher by privileged identity
description: >
  Fires when delegated or application permissions are granted to an Entra ID
  service principal that is not on the tenant approval allowlist, where the
  granted scopes permit mail, file or directory read, and either the consenting
  identity holds a privileged directory role or belongs to a high-value group.
  A fire means an identity with meaningful access has authorized a third party
  to act on its behalf. The adversary does not need the password again, does not
  trigger sign-in risk, and retains access through password reset and MFA
  re-enrollment. Treat as potential active compromise until the application is
  positively identified as legitimate and business-approved.
status: production
created: "2026-01-26"
last_modified: "2026-09-15"
author: Detection Engineering
owner: Detection Engineering

